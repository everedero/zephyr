#USB related configs
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_AUDIO2_CLASS=y
CONFIG_SAMPLE_USBD_PID=0x0010
CONFIG_SAMPLE_USBD_PRODUCT="UAC2 DAC sample"

#DAC related configs
CONFIG_DAC=y
CONFIG_RING_BUFFER=y
# System tick raised to 96000 Hz so that a 2-tick k_timer period equals
# exactly 20.83 us = 48 kHz sample rate on the 216 MHz Cortex-M7.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=96000

#LOG subsystem related configs
CONFIG_LOG=y
CONFIG_USBD_LOG_LEVEL_WRN=y
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
