CONFIG_ADC=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ADC_AD7928_ACQUISITION_THREAD_STACK_SIZE=1024

CONFIG_I2C=y

CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_ADC_LOG_LEVEL_DBG=y
CONFIG_ADC_AD7928_LOG_LEVEL_DBG=y
# Also enable the per-transfer TX/RX word dump (the IS_ENABLED guard in adc_ad7928.c:140)
CONFIG_ADC_AD7928_DEBUG_SPI_TRANSFERS=y
