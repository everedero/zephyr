sample:
  name: silly audio (k_sleep)
  description: Silly attempt at 48 kHz audio using the Zephyr standard DAC
    driver, pacing each sample with k_sleep(K_USEC(20)). Emits a custom
    trace event at every sample iteration.
common:
  tags: dac tracing
  harness: console
  harness_config:
    type: multi_line
    regex:
      - "silly"
tests:
  sample.silly.audio.sleep:
    platform_allow: nucleo_f756zg
    depends_on: dac
