# The Kconfig defaults are too small for this sample on arduino_due, which
# enables CONFIG_HW_STACK_PROTECTION and therefore faults instead of silently
# corrupting memory. Measured peak usage with CONFIG_THREAD_ANALYZER: main
# 5516 bytes, system work queue 1952 bytes, UDC driver thread 272 bytes.
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_UDC_SAM_USBHS_STACK_SIZE=1024
