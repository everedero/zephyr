# Feed the DAC by hand from a per-sample timer ISR instead of DMA: same audio,
# ~16000 interrupts/s instead of ~50. Uncomment for the no-DMA trace.
#CONFIG_AUDIO_DAC_STM32_DMA=y
#CONFIG_PM=y

CONFIG_AUDIO_DAC_STM32_TRACE_GPIO=n

CONFIG_TRACING=y
CONFIG_TRACING_CTF=y
CONFIG_TRACING_BACKEND_RAM=y
CONFIG_TRACING_BUFFER_SIZE=2048
CONFIG_RAM_TRACING_BUFFER_SIZE=65536
CONFIG_TRACING_SYNC=y
CONFIG_TRACING_ISR=y
CONFIG_TRACING_SEMAPHORE=y
