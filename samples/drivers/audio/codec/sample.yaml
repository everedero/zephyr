sample:
  description: onchip audio codec example application
  name: audio codec sample
tests:
  sample.drivers.audio.codec:
    filter: dt_nodelabel_enabled("audcodec")
    tags: codec
    integration_platforms:
      - sf32lb52_devkit_lcd
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "Audio codec sample"
        - "Exiting"
  sample.drivers.audio.codec.stm32_dac:
    build_only: true
    tags: codec
    platform_allow:
      - nucleo_h743zi
      - nucleo_g474re
      - nucleo_l552ze_q
      - nucleo_f746zg
      - nucleo_f429zi
    integration_platforms:
      - nucleo_h743zi
      - nucleo_g474re
